<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{Title}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
 <style>
    :root { --ink:#14283c;--muted:#5e7182;--navy:#0b2238;--teal:#00a89a;--line:#dce6ec;--pale:#f3f8fa;--white:#fff; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); font:16px/1.75 'DM Sans',sans-serif; background:white; }
    a { color:#087c82; text-underline-offset:3px; }
    a:hover { color:#005c63; }
    .container { width:min(1160px,calc(100% - 48px)); margin-inline:auto; }
    .site-header { height:86px; background:var(--white); border-bottom:1px solid #e5ecf0; position:relative; z-index:5; }
    .header-inner { height:100%; display:flex; align-items:center; justify-content:space-between; gap:24px; }
    .brand { display:flex; align-items:center; gap:13px; text-decoration:none; color:var(--navy); }
    .brand-icon { width:42px; height:42px; border-radius:11px; background:var(--navy); display:grid; place-items:center; box-shadow:0 5px 14px #0b223822; }
    .brand-icon svg { width:28px; height:28px; }
    .brand-word { font-family:Manrope,sans-serif; font-size:23px; font-weight:800; letter-spacing:-.9px; line-height:1; }
    .brand-word span { color:#079c92; }
    .menu { display:flex; gap:34px; align-items:center; list-style:none; padding:0; margin:0; }
    .menu li { margin:0; padding:0; }
    .menu a { display:block; font-size:14px; font-weight:700; color:#526375; text-decoration:none; padding:8px 0; }
    .menu a:hover { color:#008c83; }
    .menu a.active { color: var(--navy); border-bottom: 2px solid var(--teal); }
    .menu-toggle { display:none; border:1px solid var(--line); background:white; border-radius:8px; padding:8px 11px; font-size:22px; line-height:1; cursor:pointer; color:var(--ink); }
    .hero { position:relative; overflow:hidden; background:radial-gradient(circle at 86% 30%,#174b5d 0,transparent 32%),linear-gradient(116deg,#0b2238 0%,#0b3045 100%); color:white; }
    .hero:after { content:""; position:absolute; width:600px;height:600px;border:1px solid #ffffff12;border-radius:50%;right:-180px;top:-235px;box-shadow:0 0 0 90px #ffffff06,0 0 0 180px #ffffff04;pointer-events:none; }
    .hero-inner { min-height:435px; display:grid; grid-template-columns:minmax(0,1.1fr) minmax(260px,.7fr); align-items:center; gap:65px; padding-block:72px; position:relative; z-index:1; }
    .eyebrow { display:flex; align-items:center; gap:12px; color:#48ddd1; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:2px; }
    .eyebrow:before { content:""; width:27px;height:2px;background:currentColor; }
    h1,h2,h3 { font-family:Manrope,sans-serif; letter-spacing:-.035em; line-height:1.2; }
    h1 { font-size:clamp(43px,5vw,64px); font-weight:800; margin:22px 0 20px; letter-spacing:-.052em; }
    .hero p { color:#bdd1df; font-size:18px; line-height:1.75; max-width:645px; margin:0; }
    .hero-visual { position:relative; padding:18px; }
    .orbit { position:absolute; inset:5%; border:1px solid #6ad8d42c; border-radius:50%; transform:rotate(-20deg) scale(1.13); }
    .diagram-card { position:relative; border:1px solid #6abac24f; border-radius:17px; padding:23px; background:#103c50cc; backdrop-filter:blur(4px); box-shadow:0 20px 65px #00111f70; }
    .diagram-title { font:700 11px Manrope,sans-serif; text-transform:uppercase;letter-spacing:1.8px;color:#92cbd0;margin-bottom:16px; }
    .diagram-row { border:1px solid #86d1d340; background:#ffffff0a; border-radius:9px; padding:13px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; color:#ecf7fa;font-size:14px;font-weight:700; }
    .diagram-row svg { width:18px; height:18px; stroke:#51d6c9;flex-shrink:0; }
    .diagram-flow { text-align:center; color:#60dbce; font-size:18px; line-height:22px; }
    .diagram-row.highlight { background:#0d807d44; border-color:#58d2c87b; margin-bottom:0; }
    .main { padding:80px 0 0; }
    .article-layout { display:grid; grid-template-columns:215px minmax(0,760px); justify-content:space-between; gap:72px; }
    .toc { align-self:start; position:sticky; top:35px; border-left:2px solid var(--line); padding-left:19px; }
    .toc-title { font-size:11px; font-weight:800; letter-spacing:1.6px; text-transform:uppercase; color:#8393a1; margin:0 0 17px; }
    .toc a { display:block; font-size:13px; font-weight:700; line-height:1.45; text-decoration:none; color:#698090; margin:0 0 18px; }
    .toc a:hover { color:#008c83; }
    .section { margin-bottom:64px; scroll-margin-top:26px; }
    .section-label { font-size:11px; font-weight:800; letter-spacing:1.9px; color:#008d85; text-transform:uppercase; margin-bottom:13px; }
    h2 { font-size:clamp(27px,3vw,35px); margin:0 0 22px; }
    .section p { font-size:16px; color:#465c6e; line-height:1.95; margin:0 0 20px; }
    .lead { font-size:18px !important; color:#334c5f !important; }
    .callout { display:flex; gap:18px; padding:24px 26px; margin-top:28px; border-left:4px solid var(--teal); background:#edf8f7; border-radius:0 10px 10px 0; }
    .callout-icon { color:#078e87; flex-shrink:0; }
    .callout strong { display:block; font:800 16px Manrope,sans-serif; margin-bottom:5px; }
    .callout p { margin:0; font-size:14px; line-height:1.7; }
    .benefits-band { background:var(--pale); border-top:1px solid #e2edf0; border-bottom:1px solid #e2edf0; padding:73px 0 79px; }
    .benefits-top { max-width:730px; margin-bottom:32px; }
    .benefits-top h2 { margin-bottom:14px; }
    .benefits-top p { color:var(--muted); margin:0; }
    .benefits { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; }
    .benefit { background:white; padding:26px 24px 25px; border:1px solid #e0e9ed; border-radius:12px; box-shadow:0 8px 22px #092d4210; }
    .benefit-icon { display:grid; place-items:center; width:42px;height:42px;border-radius:10px; background:#e3f6f3; margin-bottom:21px; color:#058e86; }
    .benefit svg { width:23px; height:23px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round;stroke-linejoin:round; }
    .benefit h3 { font-size:17px;margin:0 0 10px; }
    .benefit p { font-size:14px; line-height:1.75; color:#647687; margin:0; }
    .bottom { padding:78px 0; display:flex; align-items:center; justify-content:space-between; gap:40px; }
    .bottom h2 { font-size:29px; margin:0 0 11px; }
    .bottom p { color:var(--muted); max-width:660px; margin:0; }
    .button { display:inline-flex; align-items:center; gap:12px; text-decoration:none; background:#078d85; color:white; padding:13px 21px; border-radius:8px; font-weight:800; white-space:nowrap; box-shadow:0 6px 16px #068a8335; }
    .button:hover { background:#076b68;color:white; }
    footer { background:#0b2238; color:#a6bccd; padding:28px 0; }
    .footer-inner { display:flex;align-items:center;justify-content:space-between;gap:20px;font-size:13px; }
    footer strong { font-family:Manrope,sans-serif; color:white; font-size:17px; }
    @media(max-width:800px) { .hero-inner{grid-template-columns:1fr;gap:25px;padding-block:65px}.hero-visual{max-width:440px;padding:0 0 15px}.article-layout{grid-template-columns:1fr}.toc{display:none}.main{padding-top:60px}.benefits{grid-template-columns:repeat(2,minmax(0,1fr))}.bottom{align-items:flex-start;flex-direction:column} }
    @media(max-width:560px) { .container{width:min(100% - 34px,1160px)}.site-header{height:70px}.brand-word{font-size:20px}.brand-icon{width:36px;height:36px}.menu-toggle{display:block}.menu{display:none;position:absolute;top:70px;left:0;right:0;padding:15px 20px;background:white;border-bottom:1px solid var(--line);box-shadow:0 16px 30px #0b223816;flex-direction:column;gap:10px;align-items:stretch}.menu.open{display:flex}.menu li{width:100%}.menu a{padding:10px}.menu a[href="/why-another-cms.html"]{border-bottom:0;background:#e9f6f4;border-radius:7px}.hero-inner{padding-block:58px}.hero p{font-size:16px}.hero-visual{display:none}.section{margin-bottom:48px}.benefits{grid-template-columns:1fr}.benefits-band{padding:58px 0}.bottom{padding:60px 0}.footer-inner{flex-direction:column;align-items:flex-start} }
    /* Simple editor-friendly article presentation. */
    .hero,.toc,.benefits-band,.bottom,.section-label { display:none; }
    .main { padding:0; }
    .article-layout { display:block; max-width:790px; margin:0 auto; }
    .article-layout article { padding:65px 0 85px; }
    .article-layout article > h1 { color:var(--navy); font-size:clamp(34px,4.5vw,46px); margin:0 0 25px; padding-bottom:25px; border-bottom:1px solid var(--line); }
    .section { margin:0; }
    .section h2 { font-size:25px; margin:43px 0 17px; }
    .section p,.section .lead { font-size:16px !important; color:#465c6e !important; line-height:1.9; margin:0 0 21px; }
    .callout { display:block; margin:0; padding:0; background:none; border:0; }
    .callout-icon { display:none; }
    .callout strong { display:none; }
    .callout p { font-size:16px; }
    @media(max-width:800px) { .article-layout article { padding:52px 0 66px; } }
  </style>
</head>

const menuLinks = document.querySelectorAll(".menu a");

for (const link of menuLinks) {
    const linkPath = new URL(link.href).pathname;

    if (linkPath === currentPath) {
        link.classList.add("active");
    }
}</script>
